name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Linux release and prepare assets
        run: |
          mkdir -p dist
          tar -czf dist/goodbyedpi-turkey-linux.tar.gz install.sh remove.sh status.sh linux/ README.md LICENSE
          zip -r dist/goodbyedpi-turkey-linux.zip install.sh remove.sh status.sh linux/ README.md LICENSE
          cp android/GoodbyeDPI-Android.apk dist/GoodbyeDPI-Android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GoodbyeDPI-Android.apk
            dist/goodbyedpi-turkey-linux.tar.gz
            dist/goodbyedpi-turkey-linux.zip
          name: "GoodbyeDPI-Turkey ${{ github.ref_name }} (Linux & Android)"
          body: |
            ## 🇹🇷 GoodbyeDPI-Turkey (Linux & Android)

            Discord, Roblox ve Türkiye'de internet servis sağlayıcıları tarafından engellenen servislere **VPN kullanmadan** ve **internet hızında yavaşlama olmadan** erişim sağlayan güncel sürüm.

            ---

            ### 📦 İndirme Seçenekleri (Assets)

            - **Android İçin:** `GoodbyeDPI-Android.apk` dosyasını telefonunuza indirip kurun.
            - **Linux İçin:** `goodbyedpi-turkey-linux.tar.gz` veya `goodbyedpi-turkey-linux.zip` arşivini indirip ayıklayın.

            ---

            ### 🐧 Linux Kullanımı (Açılışta Otomatik Başlar)

            ```bash
            sudo ./install.sh
            ```
            - Bilgisayarınızı yeniden başlatsanız bile arka planda otomatik çalışmaya devam eder.
            - Kaldırmak istediğinizde: `sudo ./remove.sh`

            ---

            ### 📱 Android Kullanımı (ByeByeDPI v1.8.2)

            1. Eski ByeDPI kuruluysa kaldırın, APK'yı kurun ve bağlanıp VPN iznini onaylayın.
            2. Telefonun **Özel DNS** ayarına `dns.google` yazın (olmazsa `one.one.one.one`).
            3. Uygulamada **Proxy test** ile operatörünüzde çalışan komutu bulup uygulayın.
            4. **Apps filter** ile yalnızca Discord'u seçebilirsiniz.
            5. **Autostart service on device startup** seçeneğini açın ve pil kısıtlamasını kaldırın.
            - Ayrıntılar: android/README.md
            - Hiçbir ayar her operatörde garanti çalışmaz; çalışmazsa Proxy test ile farklı komut deneyin.
